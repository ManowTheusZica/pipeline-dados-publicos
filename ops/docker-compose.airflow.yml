# Airflow local para agendar o pipeline (opcional: o CLI roda sozinho).
#
#   docker compose -f ops/docker-compose.airflow.yml up -d
#   open http://localhost:8080   (admin / admin)
#
# O projeto e' montado em /opt/pipeline e os DAGs em /opt/airflow/dags.
x-airflow-comum: &airflow-comum
  image: apache/airflow:2.9.3-python3.11
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "true"
    PIPELINE_DB: /opt/pipeline/data/indicadores.db
    TZ: America/Sao_Paulo
  volumes:
    - ./dags:/opt/airflow/dags
    - ../:/opt/pipeline
    - airflow-logs:/opt/airflow/logs
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow"]
      interval: 5s
      retries: 10
    volumes:
      - airflow-db:/var/lib/postgresql/data

  airflow-init:
    <<: *airflow-comum
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate &&
        airflow users create --username admin --password admin \
          --firstname Admin --lastname Local --role Admin --email admin@exemplo.com

  airflow-webserver:
    <<: *airflow-comum
    command: webserver
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      retries: 5

  airflow-scheduler:
    <<: *airflow-comum
    command: scheduler

volumes:
  airflow-db:
  airflow-logs:
