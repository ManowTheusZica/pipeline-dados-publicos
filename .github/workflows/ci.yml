name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Testes
        run: |
          python -m pip install --upgrade pip pytest
          python -m pytest -q

      - name: Rodar o pipeline offline (fixtures)
        run: python -m pipeline run --fixture

      - name: Rodar de novo e provar idempotencia (0 linhas novas)
        run: |
          python -m pipeline run --fixture | tee segunda.txt
          grep -q "0 novas" segunda.txt

      - name: Relatorio e status
        run: |
          python -m pipeline relatorio
          python -m pipeline status
